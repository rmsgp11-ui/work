function events(from,to){
  const out=[];let d=new Date(from+'T00:00');d.setDate(1);d.setMonth(d.getMonth()-1);
  const end=new Date(to+'T00:00');
  while(d<=end){
    rawEvents(d.getFullYear(),d.getMonth()+1).forEach(e=>{const date=nextBiz(e.raw);if(date>=from&&date<=to)out.push({...e,date,key:`${e.t}|${e.raw}|${e.label}`});});
    d.setMonth(d.getMonth()+1);
  }
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.t<b.t?-1:1);
}

function parse(text){
  let t=' '+text+' ',due=null,pri=4,client=null; const base=todayStr();
  const rules=[[/\s오늘\s/,()=>base],[/\s내일\s/,()=>addDays(base,1)],[/\s모레\s/,()=>addDays(base,2)]];
  for(const [re,fn] of rules) if(re.test(t)){due=fn();t=t.replace(re,' ');break;}
  if(!due){const m=t.match(/\s(다음\s?주\s?)?([월화수목금토일])요일(까지)?\s/);
    if(m){const tg=WD.indexOf(m[2]),cur=new Date(base+'T00:00').getDay();let n=(tg-cur+7)%7;if(m[1])n+=7;else if(n===0)n=7;due=addDays(base,n);t=t.replace(m[0],' ');}}
  if(!due){const m=t.match(/\s(\d{1,2})[\/.](\d{1,2})(까지)?\s/);
    if(m){const y=new Date().getFullYear();let s=`${y}-${pad(+m[1])}-${pad(+m[2])}`;if(diffDays(s)<-30)s=`${y+1}-${pad(+m[1])}-${pad(+m[2])}`;due=s;t=t.replace(m[0],' ');}}
  const pm=t.match(/\s!([1-4])\s/); if(pm){pri=+pm[1];t=t.replace(pm[0],' ');}
  const hm=t.match(/\s#(\S+)\s/); if(hm){const id=matchClient(hm[1]);if(id){client=id;t=t.replace(hm[0],' ');}}
  if(!client){const hit=S.clients.find(c=>{const n=norm(c.name);return n.length>=3&&norm(t).includes(n)});if(hit)client=hit.id;}
  if(!client){for(const w of t.split(/\s+/)){const k=norm(w.replace(/(에게|한테|께|의|에|님|사)$/,''));if(k.length<3)continue;const hs=S.clients.filter(c=>norm(c.name).includes(k));if(hs.length===1){client=hs[0].id;break;}}}
  return {title:t.trim().replace(/\s+/g,' '),due,pri,client};
}

function importTalk(d){
  if(!d||!Array.isArray(d['업체']))return {err:'형식이 달라요'};
  const have=new Set(S.logs.map(l=>l.key).filter(Boolean));let add=0,dup=0,skip=[],miss=[];
  for(const g of d['업체']){
    const internal=/내부/.test(g['구분']||'');
    if(internal&&!g['가져오기']){skip.push(g['업체명']);continue;}
    const names=String(g['업체명']||'').replace(/대표\s*개인톡|\((?!주\)|유\))(.*?)\)/g,m=>m.startsWith('(')?','+m.slice(1,-1):'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    const ids=[...new Set(names.map(n=>matchClient(n)||matchClient(n.replace(/[_\s].*$/,''))).filter(Boolean))];
    if(!ids.length&&!internal){miss.push(g['업체명']);continue;}
    for(const h of g['히스토리']||[]){
      const t=h['내용요약']||'';let cid=internal?(h['거래처']&&matchClient(h['거래처']))||null:ids[0];
      if(ids.length>1){const hit=ids.find(id=>{const n=norm(cl(id).name);return n&&norm(t).includes(n.slice(0,Math.min(n.length,4)))});if(hit)cid=hit;}
      const key='kt|'+(cid||g['업체명'])+'|'+h['일자']+'|'+t.slice(0,40);
      if(have.has(key)){dup++;continue;}have.add(key);
      S.logs.push({id:uid(),key,at:new Date((h['일자']||'')+'T12:00:00').getTime()||Date.now(),src:internal?'내부톡':'카톡',client:cid,title:(internal?g['업체명']+' · ':'')+(h['분류']||'카톡'),summary:t,points:[],theirs:[],text:'',taskIds:[],n:h['메시지수']||0});add++;
    }
  }
  save();render();return {add,dup,skip,miss};
}

function shrinkImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{

  let u=go(1600,.75);if(u.length>420000)u=go(1300,.6);if(u.length>420000)u=go(1100,.5);res(u);};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

function trimJobs(){const now=Date.now();S.jobs.filter(j=>j.reviewed&&hasImg(j)).forEach(j=>dropImg(j));

function jobAct(v){const [a,id]=v.split('|'),j=S.jobs.find(x=>x.id===id);if(!j)return;

const RT=[['wh','원천세'],['vat','부가세'],['ye','연말정산'],['pit','소득세'],['cit','법인세']];

const _rawC={};const rawC=(y,m)=>_rawC[y+'-'+m]||(_rawC[y+'-'+m]=rawEvents(y,m));
function repCell(cid,col){
  if(col.wym&&S.rpt.wh[col.wym]&&col.wym<pgNow()){const r=S.rpt.wh[col.wym][cid];if(!r)return {na:true,evs:[]};}
  const c=cl(cid),op=c&&c.open||'',cz=c&&c.close||'';const evs=[];col.ev.forEach(([y,m,ts])=>rawC(y,m).forEach(e=>{if(ts.includes(e.t)&&e.ids.includes(cid)&&!(op&&e.raw<op)&&!(cz&&e.raw.slice(0,7)>addDays(cz,40).slice(0,7)))evs.push(e)}));

  return {done,keys,due,late:!done&&due<todayStr(),evs};
}

function repSide(kind){
  const Y=ui.ry||new Date().getFullYear(),T=todayStr();let items='',SD=0,ST=0;
  const it=(sel,on,t,sub,done,tot,late)=>`<div class="rsi ${on?'on':''}" data-rsel="${sel}"><div class="t"><b>${t}</b><span>${sub}</span></div>${tot?`<div class="p"><span class="${done>=tot?'ok':late?'late':''}">${done}/${tot}</span><i><em style="width:${Math.round(done/tot*100)}%"></em></i></div>`:'<div class="p"><span class="sub">—</span></div>'}</div>`;

  img:async(id)=>{const j=S.jobs.find(x=>x.id===id);return j?await getImg(j):''},
  add:(o)=>{const key=String(o.client||'').replace(/\D/g,'');const c=S.clients.find(x=>key.length>=10&&String(x.bizno||'').replace(/\D/g,'')===key)||S.clients.find(x=>x.name===o.client)||S.clients.find(x=>o.client&&x.name.includes(o.client));
    const j={id:uid(),client:c?c.id:null,kind:o.kind||'other',ym:o.ym||'',text:o.text||'',img:'',memo:o.memo||'',status:o.status||'done',result:o.result||'',review:o.review||null,prog:Array.isArray(o.prog)?o.prog:null,reviewed:null,created:Date.now(),doneAt:(o.status||'done')==='done'?Date.now():null};
    if(j.client&&j.ym&&j.prog)j.prog.forEach(k=>PGN[k]&&pgv(j.client,k,j.ym)!=='d'&&pgSet(j.client,k,j.ym,'p'));S.jobs.push(j);save();if(!ui.drawer)render();return {id:j.id,client:c?c.name:null};},
  update:(id,patch)=>{const j=S.jobs.find(x=>x.id===id);if(!j)return false;['status','result','review','prog'].forEach(k=>{if(patch[k]!==undefined)j[k]=patch[k]});

    if(patch.status==='done'){j.doneAt=Date.now();}save();if(!ui.drawer)render();return true;}
};

const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(p,salt){const base=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(o)));return {iv:b64(iv),ct:b64(ct)};}
async function unseal(k,b){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(b.iv)},k,ub64(b.ct))));}

async function unlockVault(){
  if(VK){vTimer();return true;}
  if(!window.crypto||!crypto.subtle){toast('이 브라우저에서는 보안 정보를 쓸 수 없어요');return false;}
  if(!S.vault){return true;
    const p=await askPass('보안 비밀번호 만들기','주민번호·홈택스 계정을 암호화할 비밀번호예요(8자 이상). 어디에도 저장되지 않아서, 잊으면 보안 정보를 다시 가져와야 해요.',true);
    if(!p) return false;
    const salt=crypto.getRandomValues(new Uint8Array(16)),k=await deriveKey(p,salt);
    S.vault={salt:b64(salt),check:await seal(k,{ok:1}),data:{}}; VK=k; save(); vTimer(); return true;
  }
  const p=await askPass('보안 비밀번호 입력','마지막으로 한 번만 입력하면 잠금이 없어져요.'); if(!p) return false;
  try{const k=await deriveKey(p,ub64(S.vault.salt));await unseal(k,S.vault.check);VK=k;vTimer();return true;}
  catch(e){toast('비밀번호가 맞지 않아요');return false;}
}

function shrinkCard(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const go=(w,q)=>{const sc=Math.min(1,w/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);const x=cv.getContext('2d');x.filter='grayscale(1) contrast(1.15)';x.drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',q);};
  let u=go(900,.7);if(u.length>110000)u=go(800,.6);if(u.length>110000)u=go(700,.5);res(u);};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

async function importSecrets(file){
  let d;try{d=JSON.parse(await file.text());}catch(e){return toast('파일을 읽지 못했어요');}
  if(d.kind!=='workapp-secrets'||!Array.isArray(d.items)) return toast('보안정보 가져오기용 파일이 아니에요');
  if(!S.clients.length) return toast('거래처를 먼저 가져와 주세요');
  if(!await migrateVault()) return;
  S.sec=S.sec||{}; let n=0,miss=0;
  for(const it of d.items){
    const c=(it.bizno&&S.clients.find(c=>c.bizno===it.bizno))||S.clients.find(c=>norm(c.name)===norm(it.name)&&c.type===it.type);
    if(!c){miss++;continue;}
    const cur=S.sec[c.id]||{};
    S.sec[c.id]={rrn:it.rrn||cur.rrn||'',htId:it.htId||cur.htId||'',htPw:it.htPw||cur.htPw||''}; n++;
  }
  save(); render(); toast(`보안 정보 ${n}곳 넣었어요${miss?` · 못 찾은 곳 ${miss}`:''}. 받은 파일은 지워 주세요`);
}
function importAddr(text){
  let n=0,miss=0;
  text.split(/\r?\n/).forEach(line=>{
    const m=line.match(/(\d{3})-?(\d{2})-?(\d{5})/); if(!m) return;
    const bz=`${m[1]}-${m[2]}-${m[3]}`, c=S.clients.find(c=>c.bizno===bz); if(!c){miss++;return;}
    const cells=line.split(/\t|\s{3,}/).map(x=>x.trim()).filter(Boolean);
    let addr=cells.filter(x=>/(특별시|광역시|자치시|도|시|군|구)\s|로\s?\d|길\s?\d/.test(x)).sort((a,b)=>b.length-a.length)[0];
    if(!addr) addr=line.slice(line.indexOf(m[0])+m[0].length).trim();
    if(addr&&addr.length>5){c.addr=addr;n++;}
  });
  save(); render(); toast(`주소 ${n}곳 넣었어요${miss?` · 거래처에 없는 사업자번호 ${miss}개`:''}`);
}

  $('#liveEnd').disabled=true;$('#liveEnd').textContent='정리 중…';
  if(tx.length!==L.aiLen||!L.ai)await runLive(true);
  const a=L.ai||{client:null,title:'통화',summary:'',points:[],mine:[],theirs:[]},ids=[];
  a.mine.filter(m=>L.picked[m.title]!==false).forEach(m=>{const id=uid();ids.push(id);S.tasks.push({id,title:m.title,client:a.client,due:m.due,pri:m.pri,status:'todo',memo:`📞 ${a.title}\n${a.summary}`,subs:[],created:Date.now(),doneAt:null});});
  S.logs.push({id:uid(),at:Date.now()-L.elapsed,src:'통화',client:a.client,title:a.title,summary:a.summary,points:a.points,theirs:a.theirs,text:tx.slice(0,8000),taskIds:ids});
  save();$('#liveEnd').disabled=false;$('#liveEnd').textContent='통화 끝 · 저장';closeLive(true);ui.tab='logs';render();toast(`통화를 저장했어요${ids.length?` · 할 일 ${ids.length}개`:''}`);
}

    payTpl:()=>{$('#mbox').classList.remove('mbw','mbx');$('#mbox').innerHTML=`<h3>엑셀 양식 받기</h3><p class="note">CMS·홈택스 파일이 없으면 양식에 적어서 <b>📥 엑셀 올리기</b>로 올리세요. 자동으로 정리돼요.</p><button class="btn g" data-a="xlTplPay" style="justify-content:center">수금 양식 (청구·입금·미수)</button><button class="btn g" data-a="xlTplInv" style="justify-content:center">세금계산서 발행 양식</button><button class="btn" data-a="modalClose" style="justify-content:center">닫기</button>`;$('#modal').classList.add('on');}, xlTplPay:()=>xlTpl('pay'), xlTplInv:()=>xlTpl('inv'), xlTplCl:()=>xlTpl('client'),
    repReset, payUp, xmSave, cDelete, xlTpl, xlClientUp, payRep, repXls, repPrint, repY:()=>{},  jobNew:jobForm, jobSave, jobRun:()=>{const r=S.jobs.filter(j=>j.status==='ready');if(!r.length)return;if(!confirm(`올려둔 작업 ${r.length}건을 일괄 수행할까요?`))return;r.forEach(j=>j.status='wait');S.jobReq=Date.now();save();render();toast(`${r.length}건 수행 요청했어요`);},

document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;

  if(d.in&&d.in!=='sort'&&d.in!=='lc'&&d.in!=='pgs'){ui[d.in]=el.value;const pos=el.selectionStart;render();const n=$(`[data-in="${d.in}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return;}
  if(ui.drawer==='task'){const x=S.tasks.find(t=>t.id===ui.openTask);if(!x)return;
    if(el.id==='dTitle')x.title=el.value;else if(el.id==='dMemo')x.memo=el.value;else if(d.subt){const s=x.subs.find(s=>s.id===d.subt);if(s)s.t=el.value;}else return;save();return;}

});

  if(d.sub){const x=S.tasks.find(t=>t.id===ui.openTask);const s=x.subs.find(s=>s.id===d.sub);if(s)s.d=el.checked;save();return;}
  if(ui.drawer==='client'&&d.cf2&&el.tagName==='SELECT'){const c=cl(ui.openClient);let v=el.value;if(d.cf2==='fy')v=+v;if(d.cf2==='sincere')v=v==='1';c[d.cf2]=v;save();openClient(c.id);return;}
  if(d.pk!==undefined){picks[+d.pk].on=el.checked;return;}

  if(el.id==='jImg'&&el.files[0]){$('#jImgP').textContent='사진 줄이는 중…';shrinkImg(el.files[0]).then(u=>{ui.jobImg=u;$('#jImgP').innerHTML=`<img src="${u}" style="max-width:100%;max-height:160px;border-radius:8px"> ${Math.round(u.length/1024)}KB`;}).catch(()=>{$('#jImgP').textContent='사진을 읽지 못했어요 (JPG·PNG로 올려 주세요)';});return;}
  if(d.logclient){const l=S.logs.find(x=>x.id===d.logclient);l.client=el.value||null;save();return;}
  if(d.mine!==undefined&&L&&L.ai){L.picked[L.ai.mine[+d.mine].title]=el.checked;return;}
});
